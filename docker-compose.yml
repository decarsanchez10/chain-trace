version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chaintrace_db
    environment:
      POSTGRES_DB: chaintrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: chaintrace_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=chaintrace
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: chaintrace_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
